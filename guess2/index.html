<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜数字对决 · 单机版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #0f1626;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
}
h1 { font-size: 22px; color: #58a6ff; margin-bottom: 12px; font-weight: normal; }
.panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 18px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 12px;
}
.panel h2 { font-size: 15px; color: #8b949e; margin-bottom: 10px; font-weight: normal; }
input, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #30363d;
    outline: none;
}
input {
    width: 100%;
    padding: 10px 12px;
    background: #0d1117;
    color: #e6edf3;
    margin-bottom: 10px;
    letter-spacing: 2px;
}
input:focus { border-color: #58a6ff; }
button {
    padding: 10px 16px;
    background: #238636;
    color: #fff;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
    width: 100%;
    margin-bottom: 8px;
}
button:hover { opacity: 0.85; }
button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
button.sec { background: #21262d; border: 1px solid #30363d; }
button.danger { background: #da3633; }
#game { display: none; width: 100%; max-width: 520px; }
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px;
}
.stat .label { font-size: 12px; color: #8b949e; }
.stat .value { font-size: 20px; font-weight: bold; margin-top: 4px; }
.green { color: #3fb950; }
.pink { color: #f778ba; }
.gold { color: #d29922; }
#log {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 10px;
}
#log .me { color: #3fb950; }
#log .opp { color: #f778ba; }
#log .sys { color: #8b949e; font-style: italic; }
#log .win { color: #d29922; font-weight: bold; }
.turn {
    text-align: center;
    font-size: 14px;
    padding: 8px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    margin-bottom: 10px;
}
.turn.active { border-color: #3fb950; color: #3fb950; }
.turn.wait { color: #8b949e; }
#history { font-size: 12px; color: #8b949e; margin-top: 8px; }
#history div { padding: 2px 0; }
</style>
</head>
<body>

<h1>🎯 猜数字对决 · 单机版</h1>

<div id="menu" class="panel">
    <h2>和电脑对战 · 初始资金 200,000</h2>
    <button id="startBtn">开始游戏</button>
    <div style="font-size:13px;color:#8b949e;margin-top:8px;line-height:1.7">
        分两局：第 1 局你猜，第 2 局电脑猜。<br>
        每局猜解方先宣言回合数，出题方叫赌回合注。<br>
        每回合：猜解方叫注 → 出题方跟注/投降 → 猜解方猜 → 立即结算。
    </div>
</div>

<div id="game">
    <div class="stats">
        <div class="stat">
            <div class="label">我 <span class="green">●</span></div>
            <div class="value green" id="myMoney">200,000</div>
            <div class="label" style="margin-top:6px">身份：<span id="myRole">-</span></div>
        </div>
        <div class="stat">
            <div class="label">电脑 <span class="pink">●</span></div>
            <div class="value pink" id="oppMoney">200,000</div>
            <div class="label" style="margin-top:6px">身份：<span id="oppRole">-</span></div>
        </div>
    </div>

    <div class="turn wait" id="turnBar">准备开始...</div>

    <div id="log"></div>

    <div class="panel" id="actionPanel"></div>

    <div id="history"></div>
</div>

<script>
// ==================== 常量 ====================
const START_MONEY = 200000;
const DIGITS = 6;

// ==================== 状态 ====================
const G = {
    myMoney: START_MONEY,
    oppMoney: START_MONEY,
    myStartMoney: START_MONEY,
    oppStartMoney: START_MONEY,
    round: 1,
    totalRounds: 2,
    myTurn: null,          // true=我猜, false=我出题
    mySecret: '',
    oppSecret: '',
    myGuessHistory: [],
    oppGuessHistory: [],
    guessedRounds: 0,      // 本局已完成的回合数
    betRounds: 0,          // 宣言回合数
    roundBetAmount: 0,     // 赌回合固定金额
    phase: 'idle',
};

// ==================== 工具 ====================
function fmt(n) { return Math.round(n).toLocaleString('zh-CN'); }

function log(msg, cls = 'sys') {
    const el = document.getElementById('log');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function updateStats() {
    document.getElementById('myMoney').textContent = fmt(G.myMoney);
    document.getElementById('oppMoney').textContent = fmt(G.oppMoney);
    let myRole = '-', oppRole = '-';
    if (G.myTurn === true) { myRole = '猜解方'; oppRole = '出题方'; }
    else if (G.myTurn === false) { myRole = '出题方'; oppRole = '猜解方'; }
    document.getElementById('myRole').textContent = myRole;
    document.getElementById('oppRole').textContent = oppRole;
}

function setTurnBar(text, active) {
    const bar = document.getElementById('turnBar');
    bar.textContent = text;
    bar.className = 'turn ' + (active ? 'active' : 'wait');
}

function judge(secret, guess) {
    let A = 0, B = 0;
    const s = secret.split('');
    const g = guess.split('');
    const sUsed = new Array(DIGITS).fill(false);
    const gUsed = new Array(DIGITS).fill(false);
    for (let i = 0; i < DIGITS; i++) {
        if (s[i] === g[i]) { A++; sUsed[i] = true; gUsed[i] = true; }
    }
    for (let i = 0; i < DIGITS; i++) {
        if (sUsed[i]) continue;
        for (let j = 0; j < DIGITS; j++) {
            if (gUsed[j]) continue;
            if (s[i] === g[j]) { B++; sUsed[i] = true; gUsed[j] = true; break; }
        }
    }
    return `${A}A${B}B`;
}

function randomSecret() {
    let s = '';
    for (let i = 0; i < DIGITS; i++) s += Math.floor(Math.random() * 10);
    return s;
}

// ==================== 投降罚金 ====================
function calcPenalty(oppStartMoney, completedRounds, currentTurnBet) {
    let coeff, base;
    const r = completedRounds;
    if (r <= 10) {
        coeff = (50 + r) / 100;
        base = oppStartMoney * 0.05;
    } else if (r <= 20) {
        coeff = (50 + r) / 100;
        base = oppStartMoney * 0.10;
    } else if (r <= 30) {
        coeff = (50 - r) / 100;
        base = oppStartMoney * 0.20;
    } else {
        coeff = (50 - r) / 100;
        base = 0;
    }
    if (coeff < 0) coeff = 0;
    const penalty = oppStartMoney * 0.10 * coeff + currentTurnBet * 0.10 + base;
    return Math.max(0, Math.round(penalty));
}

// ==================== 电脑 AI ====================
let aiCandidates = [];
function aiInit() {
    aiCandidates = [];
    for (let i = 0; i < 5000; i++) aiCandidates.push(randomSecret());
}
function aiGuess() {
    if (aiCandidates.length === 0) return randomSecret();
    return aiCandidates[Math.floor(Math.random() * aiCandidates.length)];
}
function aiFeedback(guess, result) {
    aiCandidates = aiCandidates.filter(c => judge(c, guess) === result);
}

// ==================== 游戏流程 ====================
function startGame() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    G.round = 1;
    G.myMoney = START_MONEY;
    G.oppMoney = START_MONEY;
    updateStats();
    startRound();
}

function startRound() {
    G.guessedRounds = 0;
    G.myGuessHistory = [];
    G.oppGuessHistory = [];
    G.myStartMoney = G.myMoney;
    G.oppStartMoney = G.oppMoney;
    G.betRounds = 0;
    G.roundBetAmount = 0;

    G.myTurn = (G.round === 1);

    if (!G.myTurn) {
        // 我出题
        G.mySecret = randomSecret();
        log(`【第 ${G.round} 局】你出题，题目已生成（${G.mySecret}）`, 'me');
        aiInit();
    } else {
        // 我猜
        G.oppSecret = randomSecret();
        log(`【第 ${G.round} 局】你猜解`, 'me');
    }

    updateStats();
    document.getElementById('history').innerHTML = '';

    if (G.myTurn) {
        setTurnBar('你是猜解方，宣言你几回合内能猜出', true);
        showBetRoundsInput();
    } else {
        setTurnBar('电脑正在思考宣言...', false);
        document.getElementById('actionPanel').innerHTML = '';
        setTimeout(aiDeclareRounds, 1000);
    }
}

// ===== 我猜解：宣言回合数 =====
function showBetRoundsInput() {
    const panel = document.getElementById('actionPanel');
    panel.innerHTML = `
        <h2>宣言：你几回合内能猜出答案？</h2>
        <input id="roundsInput" type="number" min="1" max="99" placeholder="例如 10" style="letter-spacing:0">
        <button id="declareBtn">宣言</button>
    `;
    document.getElementById('declareBtn').onclick = () => {
        const v = parseInt(document.getElementById('roundsInput').value);
        if (!v || v < 1) { log('请输入有效回合数', 'sys'); return; }
        G.betRounds = v;
        log(`你宣言：${v} 回合内猜出`, 'me');
        panel.innerHTML = '';
        setTurnBar('电脑正在叫赌回合注...', false);
        setTimeout(aiBetRounds, 800);
    };
}

// 电脑作为出题方叫赌回合注
function aiBetRounds() {
    const minBet = Math.floor(G.oppStartMoney * 0.01);
    let amount = minBet * (1 + Math.max(0, (20 - G.betRounds)) / 20);
    amount = Math.min(amount, G.oppMoney);
    amount = Math.round(amount);
    G.roundBetAmount = amount;
    log(`电脑叫注（赌回合）：${fmt(amount)}`, 'opp');
    // 开始逐回合
    startMyTurnRound();
}

// 我的回合开始：叫注
function startMyTurnRound() {
    const minBet = Math.floor(G.myMoney * 0.01);
    const panel = document.getElementById('actionPanel');
    panel.innerHTML = `
        <h2>第 ${G.guessedRounds + 1} 回合 · 你叫注</h2>
        <p style="font-size:13px;color:#8b949e;margin-bottom:8px">最低叫注：${fmt(minBet)}</p>
        <input id="betInput" type="number" min="${minBet}" placeholder="叫注金额" style="letter-spacing:0">
        <button id="betBtn">叫注</button>
    `;
    setTurnBar(`第 ${G.guessedRounds + 1} 回合：请叫注`, true);
    document.getElementById('betBtn').onclick = () => {
        let v = parseInt(document.getElementById('betInput').value);
        if (!v || v < minBet) { log(`叫注不能低于 ${fmt(minBet)}`, 'sys'); return; }
        if (v > G.myMoney) { log('资金不足', 'sys'); return; }
        G.currentTurnBet = v;
        log(`你叫注：${fmt(v)}`, 'me');
        panel.innerHTML = '';
        setTurnBar('电脑正在决定跟注或投降...', false);
        setTimeout(aiFollowOrFold, 800);
    };
}

// 电脑决定跟注或投降
function aiFollowOrFold() {
    const amount = G.currentTurnBet;
    // 简单策略
    let fold = false;
    if (G.guessedRounds > G.betRounds) {
        fold = Math.random() < 0.7; // 超过宣言回合，倾向投降
    } else {
        fold = Math.random() < 0.15; // 否则偶尔投降
    }
    // 资金不足只能投降
    if (G.oppMoney < amount) fold = true;

    if (fold) {
        doFold('opp');
    } else {
        G.oppMoney -= amount;
        log(`电脑跟注 ${fmt(amount)}`, 'opp');
        updateStats();
        // 轮到猜解方猜
        showMyGuessInput();
    }
}

// 猜解方猜测
function showMyGuessInput() {
    const panel = document.getElementById('actionPanel');
    panel.innerHTML = `
        <h2>第 ${G.guessedRounds + 1} 回合 · 输入你的猜测</h2>
        <input id="guessInput" maxlength="6" placeholder="6 位数字" style="letter-spacing:6px;text-align:center;font-size:20px">
        <button id="guessBtn">提交猜测</button>
    `;
    setTurnBar('输入你的猜测', true);
    document.getElementById('guessBtn').onclick = () => {
        const g = document.getElementById('guessInput').value.trim();
        if (!/^\d{6}$/.test(g)) { log('必须是 6 位数字', 'sys'); return; }
        G.myGuessHistory.push(g);
        log(`你猜：${g}`, 'me');
        panel.innerHTML = '';
        const result = judge(G.oppSecret, g);
        setTimeout(() => settleMyRound(result, g), 400);
    };
}

// 结算我这一回合
function settleMyRound(result, guess) {
    log(`反馈：${result}`, 'opp');
    const div = document.createElement('div');
    div.textContent = `${guess} → ${result}`;
    document.getElementById('history').appendChild(div);

    const stake = G.currentTurnBet; // 桌上双方各押了 stake

    if (result === '6A0B') {
        // 猜对：桌上 2*stake 全归我
        G.myMoney += stake * 2;
        log(`✅ 猜对！你赢得本回合赌注 ${fmt(stake * 2)}`, 'win');
        updateStats();
        // 本局结束，结算赌回合
        settleRoundBet('me');
        return;
    } else {
        // 猜错：桌上 2*stake 全归电脑
        G.oppMoney += stake * 2;
        log(`❌ 猜错，本回合赌注 ${fmt(stake * 2)} 归电脑`, 'opp');
        updateStats();
    }

    G.guessedRounds++;

    // 检查是否超过宣言回合数
    if (G.guessedRounds >= G.betRounds) {
        // 已到宣言回合数还没猜中，本局结束
        log(`已用完 ${G.betRounds} 回合未猜中`, 'sys');
        settleRoundBet('opp');
        return;
    }

    // 继续下一回合
    setTimeout(startMyTurnRound, 800);
}

// ===== 电脑猜解 =====
function aiDeclareRounds() {
    const rounds = 5 + Math.floor(Math.random() * 11);
    G.betRounds = rounds;
    log(`电脑宣言：${rounds} 回合内猜出`, 'opp');
    setTurnBar('轮到你叫赌回合注', true);
    showBetRoundsResponse(rounds);
}

function showBetRoundsResponse(rounds) {
    const minBet = Math.floor(G.oppStartMoney * 0.01);
    const panel = document.getElementById('actionPanel');
    panel.innerHTML = `
        <h2>电脑宣言 ${rounds} 回合内猜出</h2>
        <p style="font-size:13px;color:#8b949e;margin-bottom:8px">最低叫注：${fmt(minBet)}</p>
        <input id="betInput" type="number" min="${minBet}" placeholder="赌回合叫注金额" style="letter-spacing:0">
        <button id="betBtn">叫注</button>
    `;
    document.getElementById('betBtn').onclick = () => {
        let v = parseInt(document.getElementById('betInput').value);
        if (!v || v < minBet) { log(`叫注不能低于 ${fmt(minBet)}`, 'sys'); return; }
        if (v > G.myMoney) { log('资金不足', 'sys'); return; }
        G.roundBetAmount = v;
        log(`你叫注（赌回合）：${fmt(v)}`, 'me');
        panel.innerHTML = '';
        setTimeout(aiTurnBet, 800);
    };
}

// 电脑作为猜解方叫注
function aiTurnBet() {
    const minBet = Math.floor(G.oppMoney * 0.01);
    let amount = Math.max(minBet, Math.floor(G.oppMoney * 0.02));
    amount = Math.min(amount, G.oppMoney);
    G.currentTurnBet = amount;
    log(`电脑叫注：${fmt(amount)}`, 'opp');
    setTurnBar('电脑叫注，你选择跟注或投降', true);
    showMyFollowOrFold(amount);
}

// 我作为出题方选择跟注或投降
function showMyFollowOrFold(amount) {
    const panel = document.getElementById('actionPanel');
    panel.innerHTML = `
        <h2>电脑叫注 ${fmt(amount)}</h2>
        <button id="followBtn">跟注（继续）</button>
        <button id="foldBtn" class="danger">投降</button>
    `;
    document.getElementById('followBtn').onclick = () => {
        if (G.myMoney < amount) { log('资金不足，只能投降', 'sys'); return; }
        G.myMoney -= amount;
        log(`你跟注 ${fmt(amount)}`, 'me');
        updateStats();
        panel.innerHTML = '';
        setTimeout(aiGuessTurn, 800);
    };
    document.getElementById('foldBtn').onclick = () => {
        doFold('me');
    };
}

// 电脑猜测
function aiGuessTurn() {
    const guess = aiGuess();
    G.oppGuessHistory.push(guess);
    log(`电脑猜：${guess}`, 'opp');

    const result = judge(G.mySecret, guess);
    setTimeout(() => {
        log(`反馈：${result}`, 'me');
        const div = document.createElement('div');
        div.textContent = `电脑: ${guess} → ${result}`;
        document.getElementById('history').appendChild(div);
        settleAiRound(result, guess);
    }, 400);
}

// 结算电脑这一回合
function settleAiRound(result, guess) {
    const stake = G.currentTurnBet;

    if (result === '6A0B') {
        // 电脑猜对：桌上 2*stake 全归电脑
        G.oppMoney += stake * 2;
        log(`电脑猜对，赢得本回合赌注 ${fmt(stake * 2)}`, 'opp');
        updateStats();
        settleRoundBet('opp');
        return;
    } else {
        // 电脑猜错：桌上 2*stake 全归我
        G.myMoney += stake * 2;
        log(`电脑猜错，本回合赌注 ${fmt(stake * 2)} 归你`, 'win');
        updateStats();
    }

    G.guessedRounds++;

    if (G.guessedRounds >= G.betRounds) {
        log(`电脑已用完 ${G.betRounds} 回合未猜中`, 'sys');
        settleRoundBet('me');
        return;
    }

    // 电脑继续下一回合
    setTimeout(aiNextRoundBet, 800);
}

// 电脑下一回合叫注
function aiNextRoundBet() {
    aiFeedback(G.oppGuessHistory[G.oppGuessHistory.length - 1], judge(G.mySecret, G.oppGuessHistory[G.oppGuessHistory.length - 1]));
    aiTurnBet();
}

// ===== 投降 =====
// by: 'me' 或 'opp' 表示谁投降
function doFold(by) {
    const amount = G.currentTurnBet;
    let penalty, winner, payout;

    if (by === 'me') {
        // 我投降（我是出题方）
        penalty = calcPenalty(G.oppStartMoney, G.guessedRounds, amount);
        if (G.guessedRounds <= G.betRounds) {
            winner = 'opp';
            payout = G.roundBetAmount;
            G.myMoney -= payout;
            G.oppMoney += payout;
            log(`你投降，投降回合(${G.guessedRounds}) ≤ 电脑宣言(${G.betRounds})，电脑赢得赌回合 ${fmt(payout)}`, 'opp');
        } else {
            winner = 'me';
            payout = G.roundBetAmount;
            G.myMoney += payout;
            G.oppMoney -= payout;
            log(`你投降，但投降回合(${G.guessedRounds}) > 电脑宣言(${G.betRounds})，你赢得赌回合 ${fmt(payout)}`, 'win');
        }
        G.myMoney -= penalty;
        G.oppMoney += penalty;
        log(`你支付投降罚金 ${fmt(penalty)}`, 'me');
        updateStats();
        endRound(winner);
    } else {
        // 电脑投降（电脑是出题方）
        penalty = calcPenalty(G.myStartMoney, G.guessedRounds, amount);
        if (G.guessedRounds <= G.betRounds) {
            winner = 'me';
            payout = G.roundBetAmount;
            G.oppMoney -= payout;
            G.myMoney += payout;
            log(`电脑投降，投降回合(${G.guessedRounds}) ≤ 你的宣言(${G.betRounds})，你赢得赌回合 ${fmt(payout)}`, 'win');
        } else {
            winner = 'opp';
            payout = G.roundBetAmount;
            G.myMoney -= payout;
            G.oppMoney += payout;
            log(`电脑投降，但投降回合(${G.guessedRounds}) > 你的宣言(${G.betRounds})，电脑赢得赌回合 ${fmt(payout)}`, 'opp');
        }
        G.oppMoney -= penalty;
        G.myMoney += penalty;
        log(`电脑支付投降罚金 ${fmt(penalty)}`, 'win');
        updateStats();
        endRound(winner);
    }
}

// ===== 赌回合结算（本局结束时）=====
// winner: 'me' 或 'opp' 表示谁赢赌回合
function settleRoundBet(winner) {
    // 赌回合金额由输方付给赢方
    const payout = G.roundBetAmount;
    if (winner === 'me') {
        G.oppMoney -= payout;
        G.myMoney += payout;
        log(`本局你赢，获得赌回合注 ${fmt(payout)}`, 'win');
    } else {
        G.myMoney -= payout;
        G.oppMoney += payout;
        log(`本局你输，支付赌回合注 ${fmt(payout)}`, 'opp');
    }
    updateStats();
    endRound(winner);
}

// ===== 本局结束 =====
function endRound(winner) {
    G.phase = 'over';
    document.getElementById('actionPanel').innerHTML = '';
    setTurnBar(winner === 'me' ? '🎉 本局你赢了！' : '本局你输了', winner === 'me');

    if (G.round < G.totalRounds) {
        setTimeout(() => {
            G.round++;
            log(`—— 第 ${G.round} 局开始 ——`, 'win');
            startRound();
        }, 3000);
    } else {
        setTimeout(() => {
            log(`===== 对决结束 =====`, 'win');
            log(`你的最终资金：${fmt(G.myMoney)}`, 'win');
            log(`电脑最终资金：${fmt(G.oppMoney)}`, 'win');
            if (G.myMoney > G.oppMoney) log('🏆 你赢得了对决！', 'win');
            else if (G.myMoney < G.oppMoney) log('你输掉了对决', 'opp');
            else log('平局', 'sys');
            document.getElementById('actionPanel').innerHTML = '<button onclick="location.reload()">再来一局</button>';
        }, 1500);
    }
}

// ==================== 初始化 ====================
document.getElementById('startBtn').onclick = () => {
    startGame();
};

log('点击「开始游戏」和电脑对战', 'sys');
</script>
