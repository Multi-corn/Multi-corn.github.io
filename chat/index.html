<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerJS 聊天测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #0f1626;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
}
h1 { font-size: 20px; color: #58a6ff; margin-bottom: 12px; font-weight: normal; }
.panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 10px;
}
input, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #30363d;
    outline: none;
}
input {
    width: 100%;
    padding: 10px 12px;
    background: #0d1117;
    color: #e6edf3;
    margin-bottom: 8px;
}
input:focus { border-color: #58a6ff; }
button {
    padding: 10px 16px;
    background: #238636;
    color: #fff;
    cursor: pointer;
    border: none;
    width: 100%;
    margin-bottom: 8px;
}
button:hover { opacity: 0.85; }
button.sec { background: #21262d; border: 1px solid #30363d; }
#status { font-size: 13px; color: #8b949e; min-height: 18px; margin-top: 6px; }
#chat {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 8px;
}
#chat .me { color: #3fb950; }
#chat .opp { color: #f778ba; }
#chat .sys { color: #8b949e; font-style: italic; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; margin-bottom: 0; }
.row button { width: auto; margin-bottom: 0; }
</style>
</head>
<body>

<h1>💬 PeerJS 聊天测试</h1>

<div class="panel">
    <input id="roomInput" placeholder="房间号（双方输入相同）">
    <button id="createBtn">创建房间</button>
    <button id="joinBtn" class="sec">加入房间</button>
    <div id="status">输入房间号，一方创建、一方加入</div>
</div>

<div class="panel" id="chatPanel" style="display:none">
    <div id="chat"></div>
    <div class="row">
        <input id="msgInput" placeholder="输入消息..." maxlength="200">
        <button id="sendBtn">发送</button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
let peer = null;
let conn = null;
let myName = '';

function setStatus(msg) {
    document.getElementById('status').textContent = msg;
}

function log(msg, cls = 'sys') {
    const el = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function setupConnection(c, isHost) {
    conn = c;
    myName = isHost ? '我(房主)' : '我(加入方)';

    c.on('open', () => {
        setStatus('已连接！');
        log('已连接，可以聊天了', 'sys');
        document.getElementById('chatPanel').style.display = 'block';
        // 把对方的显示名告诉对方
        c.send({ type: 'hello', name: isHost ? '房主' : '加入方' });
    });

    c.on('data', (data) => {
        if (data.type === 'hello') {
            log(`对方是：${data.name}`, 'sys');
        } else if (data.type === 'msg') {
            log(`${data.from}: ${data.text}`, 'opp');
        }
    });

    c.on('close', () => {
        log('对方断开了连接', 'sys');
        setStatus('连接已断开');
    });

    c.on('error', (e) => {
        log('连接错误: ' + e, 'sys');
    });
}

document.getElementById('createBtn').onclick = () => {
    const r = document.getElementById('roomInput').value.trim();
    if (r.length < 2) { setStatus('房间号至少 2 位'); return; }
    setStatus('正在创建房间...');
    peer = new Peer('chat-test-' + r);
    peer.on('open', () => {
        setStatus('房间已创建，等待对方加入...');
        peer.on('connection', (c) => {
            setStatus('对方已加入！');
            setupConnection(c, true);
        });
    });
    peer.on('error', (err) => {
        setStatus('出错：' + err.type + (err.type === 'unavailable-id' ? '（房间号被占用）' : ''));
    });
};

document.getElementById('joinBtn').onclick = () => {
    const r = document.getElementById('roomInput').value.trim();
    if (r.length < 2) { setStatus('房间号至少 2 位'); return; }
    setStatus('正在连接...');
    peer = new Peer();
    peer.on('open', () => {
        const c = peer.connect('chat-test-' + r);
        setupConnection(c, false);
    });
    peer.on('error', (err) => {
        setStatus('出错：' + err.type);
    });
};

document.getElementById('sendBtn').onclick = sendMsg;
document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMsg();
});

function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !conn || !conn.open) return;
    conn.send({ type: 'msg', from: myName, text: text });
    log(`${myName}: ${text}`, 'me');
    input.value = '';
}
</script>
</body>
</html>
