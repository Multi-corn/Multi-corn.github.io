<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase 聊天测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #0f1626;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
}
h1 { font-size: 20px; color: #58a6ff; margin-bottom: 12px; font-weight: normal; }
.panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 10px;
}
input, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #30363d;
    outline: none;
}
input {
    width: 100%;
    padding: 10px 12px;
    background: #0d1117;
    color: #e6edf3;
    margin-bottom: 8px;
}
input:focus { border-color: #58a6ff; }
button {
    padding: 10px 16px;
    background: #238636;
    color: #fff;
    cursor: pointer;
    border: none;
    width: 100%;
    margin-bottom: 8px;
}
button:hover { opacity: 0.85; }
button.sec { background: #21262d; border: 1px solid #30363d; }
#status { font-size: 13px; color: #8b949e; min-height: 18px; margin-top: 6px; }
#chat {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 8px;
}
#chat .me { color: #3fb950; }
#chat .opp { color: #f778ba; }
#chat .sys { color: #8b949e; font-style: italic; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; margin-bottom: 0; }
.row button { width: auto; margin-bottom: 0; }
</style>
</head>
<body>

<h1>💬 Supabase 聊天测试</h1>

<div class="panel">
    <input id="roomInput" placeholder="房间号（双方输入相同）">
    <button id="joinBtn">进入房间</button>
    <div id="status">输入房间号，双方都点「进入房间」</div>
</div>

<div class="panel" id="chatPanel" style="display:none">
    <div id="chat"></div>
    <div class="row">
        <input id="msgInput" placeholder="输入消息..." maxlength="200">
        <button id="sendBtn">发送</button>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ==================== Supabase 配置 ====================
const SUPABASE_URL = 'https://jzocedfhemyjlulcflrt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EncbDbv4JJwcffBu3xka-A_oMcP9757';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let channel = null;
let myName = '';
let roomId = '';

// ==================== 工具 ====================
function setStatus(msg) {
    document.getElementById('status').textContent = msg;
}

function log(msg, cls = 'sys') {
    const el = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

// ==================== 进入房间 ====================
document.getElementById('joinBtn').onclick = () => {
    roomId = document.getElementById('roomInput').value.trim();
    if (roomId.length < 2) { setStatus('房间号至少 2 位'); return; }

    setStatus('正在连接 Supabase...');

    // 用房间号作为频道名
    channel = supabase.channel('chat-' + roomId, {
        config: {
            broadcast: { self: false }  // 不发给自己
        }
    });

    // 监听广播消息
    channel.on('broadcast', { event: 'msg' }, (payload) => {
        log(`${payload.payload.from}: ${payload.payload.text}`, 'opp');
    });

    channel.on('broadcast', { event: 'hello' }, (payload) => {
        log(`对方已进入房间`, 'sys');
    });

    // 订阅频道
    channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
            setStatus('已进入房间：' + roomId);
            document.getElementById('chatPanel').style.display = 'block';
            myName = '我';
            log(`已进入房间 ${roomId}，等待对方...`, 'sys');

            // 广播一条 hello，通知对方我进来了
            channel.send({
                type: 'broadcast',
                event: 'hello',
                payload: { name: myName }
            });
        } else {
            setStatus('连接状态：' + status);
        }
    });
};

// ==================== 发送消息 ====================
document.getElementById('sendBtn').onclick = sendMsg;
document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMsg();
});

function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !channel) return;

    channel.send({
        type: 'broadcast',
        event: 'msg',
        payload: { from: myName, text: text }
    });

    log(`${myName}: ${text}`, 'me');
    input.value = '';
}
</script>
</body>
</html>
